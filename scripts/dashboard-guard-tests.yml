  "evaluation_interval": "1m",
  "tests": [
    {
      "name": "blackbox_render_backend exporter down, stale successful probe",
      "interval": "1m",
      "input_series": [
        {
          "series": "probe_success{job=\"blackbox_render_backend\",instance=\"https://example.test/\",service=\"matchwise_backend\"}",
          "values": "1 1 _"
        },
        {
          "series": "up{job=\"blackbox_render_backend\",instance=\"https://example.test/\",service=\"matchwise_backend\"}",
          "values": "1 0 0"
        }
      ],
      "promql_expr_test": [
        {
          "expr": "sum(last_over_time(probe_success{job=\"blackbox_render_backend\",instance=\"https://example.test/\",service=\"matchwise_backend\"}[3m]))",
          "eval_time": "2m",
          "exp_samples": [
            {
              "labels": "{}",
              "value": 1
            }
          ]
        },
        {
          "expr": "sum((last_over_time(probe_success{job=\"blackbox_render_backend\",service=\"matchwise_backend\"}[3m])) and on(job,instance) (up{job=\"blackbox_render_backend\",service=\"matchwise_backend\"} == 1))",
          "eval_time": "2m",
          "exp_samples": []
        }
      ]
    },
