    {
      "name": "Supabase failed scrape hides retained CPU",
      "interval": "1m",
      "input_series": [
        {
          "series": "node_cpu_seconds_total{job=\"supabase\",instance=\"db.example.test:443\",mode=\"idle\",cpu=\"0\"}",
          "values": "100 130 160 190 220"
        },
        {
          "series": "up{job=\"supabase\",instance=\"db.example.test:443\"}",
          "values": "1 1 1 0 0"
        }
      ],
      "promql_expr_test": [
        {
          "expr": "sum((100 * (1 - avg(rate(node_cpu_seconds_total{job=\"supabase\",instance=\"db.example.test:443\",mode=\"idle\"}[5m])))) and on() (min(up{job=\"supabase\",instance=\"db.example.test:443\"}) == 1))",
          "eval_time": "4m",
          "exp_samples": []
        }
      ]
    },
    {
      "name": "Supabase host CPU remains meaningful when PostgreSQL is down",
      "interval": "1m",
      "input_series": [
        {
          "series": "node_cpu_seconds_total{job=\"supabase\",instance=\"db.example.test:443\",mode=\"idle\",cpu=\"0\"}",
          "values": "100 130 160 190 220"
        },
        {
          "series": "up{job=\"supabase\",instance=\"db.example.test:443\"}",
          "values": "1 1 1 1 1"
        },
        {
          "series": "pg_up{job=\"supabase\",instance=\"db.example.test:443\"}",
          "values": "0 0 0 0 0"
        }
      ],
      "promql_expr_test": [
        {
          "expr": "sum((100 * (1 - avg(rate(node_cpu_seconds_total{job=\"supabase\",instance=\"db.example.test:443\",mode=\"idle\"}[5m])))) and on() (min(up{job=\"supabase\",instance=\"db.example.test:443\"}) == 1))",
          "eval_time": "4m",
          "exp_samples": [
            {
              "labels": "{}",
              "value": 50
            }
          ]
        }
      ]
    },
    {
