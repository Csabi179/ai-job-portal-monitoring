apiVersion: 1

contactPoints:
  - orgId: 1
    name: AI Job Telegram
    receivers:
      - uid: ai_job_telegram
        type: telegram
        disableResolveMessage: false
        settings:
          bottoken: $GRAFANA_TELEGRAM_BOT_TOKEN
          chatid: $GRAFANA_TELEGRAM_CHAT_ID

policies:
  - orgId: 1
    receiver: AI Job Telegram
    group_by:
      - alertname
    group_wait: 10s
    group_interval: 5m
    repeat_interval: 4h
