global:
  scrape_interval: 60s
  evaluation_interval: 60s

storage:
  tsdb:
    retention:
      time: 7d
      size: 2GB

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["127.0.0.1:9090"]

  - job_name: node_exporter
    static_configs:
      - targets: ["127.0.0.1:9100"]

  - job_name: blackbox_exporter
    static_configs:
      - targets: ["127.0.0.1:9115"]

  - job_name: blackbox_http
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://127.0.0.1:3000/api/health
        labels:
          service: monitoring_test
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: 127.0.0.1:9115

  - job_name: blackbox_render_backend
    scrape_interval: 30m
    scrape_timeout: 110s
    metrics_path: /probe
    params:
      module: [http_render_2xx]
    static_configs:
      - targets:
          - https://matchwise-backend-monitoring-test.onrender.com/api/health
        labels:
          service: matchwise_backend
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: 127.0.0.1:9115

  - job_name: blackbox_vercel_frontend
    scrape_interval: 60s
    scrape_timeout: 15s
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - https://www.matchwise.tech/
        labels:
          service: matchwise_frontend
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: 127.0.0.1:9115

  - job_name: supabase
    scrape_interval: 60s
    scrape_timeout: 30s
    scheme: https
    metrics_path: /customer/v1/privileged/metrics
    basic_auth:
      username: username
      password_file: /etc/prometheus/secrets/supabase-api-key
    file_sd_configs:
      - files:
          - /etc/prometheus/secrets/supabase-targets.json
        refresh_interval: 60s
