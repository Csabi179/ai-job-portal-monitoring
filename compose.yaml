services:
  prometheus:
    image: prom/prometheus:v3.13.2
    container_name: monitoring-prometheus
    network_mode: host
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.listen-address=127.0.0.1:9090
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - type: bind
        source: ../monitoring-private-secrets/prometheus
        target: /etc/prometheus/secrets
        read_only: true
        bind:
          create_host_path: false
      - prometheus_data:/prometheus
    logging: &logconfig
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  grafana:
    image: grafana/grafana:13.2.1
    container_name: monitoring-grafana
    network_mode: host
    restart: unless-stopped
    environment:
      GF_SERVER_HTTP_ADDR: "127.0.0.1"
      GF_SERVER_DOMAIN: ${GRAFANA_PUBLIC_DOMAIN:-localhost}
      GF_SERVER_ROOT_URL: ${GRAFANA_PUBLIC_URL:-http://localhost:3000/}
      GF_SECURITY_COOKIE_SECURE: ${GRAFANA_COOKIE_SECURE:-false}
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Missing password}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_LOG_MODE: console
      GRAFANA_TELEGRAM_BOT_TOKEN: ${GRAFANA_TELEGRAM_BOT_TOKEN:?Telegram bot token missing}
      GRAFANA_TELEGRAM_CHAT_ID: ${GRAFANA_TELEGRAM_CHAT_ID:?Telegram chat ID missing}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    logging: *logconfig

  node-exporter:
    image: prom/node-exporter:v1.11.1
    container_name: monitoring-node-exporter
    network_mode: host
    pid: host
    restart: unless-stopped
    command:
      - --path.rootfs=/host
      - --web.listen-address=127.0.0.1:9100
      - --collector.textfile.directory=/var/lib/node_exporter_textfile
    volumes:
      - /:/host:ro,rslave
      - ../monitoring-exporter-metrics:/var/lib/node_exporter_textfile:ro
    logging: *logconfig

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.28.0
    container_name: monitoring-blackbox-exporter
    network_mode: host
    restart: unless-stopped
    command:
      - --config.file=/etc/blackbox/blackbox.yml
      - --web.listen-address=127.0.0.1:9115
    volumes:
      - ./blackbox/blackbox.yml:/etc/blackbox/blackbox.yml:ro
    logging: *logconfig

  loki:
    image: grafana/loki:3.7.9
    container_name: monitoring-loki
    network_mode: host
    restart: unless-stopped
    command:
      - -config.file=/etc/loki/config.yaml
    volumes:
      - ./loki/loki-config.yaml:/etc/loki/config.yaml:ro
      - loki_data:/loki
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  alloy:
    image: grafana/alloy:v1.21.2
    container_name: monitoring-alloy
    network_mode: host
    restart: unless-stopped
    command:
      - run
      - --server.http.listen-addr=127.0.0.1:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - ../monitoring-private-tls:/etc/alloy/tls:ro
      - ./test-logs:/var/log/matchwise:ro
      - alloy_data:/var/lib/alloy/data
    depends_on:
      - loki
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Explicit opt-in: docker compose --profile public up -d caddy
  caddy:
    image: caddy:2.11.9-alpine
    container_name: monitoring-caddy
    profiles: ["public"]
    network_mode: host
    restart: unless-stopped
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
    volumes:
      - ./caddy:/etc/caddy:ro
      - caddy_data:/data
      - caddy_config:/config
    logging: *logconfig

volumes:
  prometheus_data:
  grafana_data:
  loki_data:
  alloy_data:
  caddy_data:
  caddy_config:
